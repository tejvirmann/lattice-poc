services:

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama
    depends_on: [ollama]
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen3:8b}"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.6.10
    ports:
      - "${OPENWEBUI_PORT:-4000}:8080"
    environment:
      - ENABLE_OLLAMA_API=false
      - RAG_EMBEDDING_ENGINE=openai
      - WEBUI_AUTH=${WEBUI_AUTH:-False}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-lattice-dev-secret}
      - WEBUI_NAME=${WEBUI_NAME:-Lattice-poc}
      - MCP_SERVER_URL=http://host.docker.internal:${MCPO_PORT:-8001}
      # OpenRouter as an OpenAI-compatible provider
      - OPENAI_API_BASE_URL=https://openrouter.ai/api/v1
      - OPENAI_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      - open-webui-data:/app/backend/data
      - ./openwebui-theme.css:/app/build/static/custom.css:ro
      - ./lattice-panel.js:/app/build/static/loader.js:ro
    restart: unless-stopped

volumes:
  ollama_data:
  open-webui-data:

# ── How this fits together ────────────────────────────────────────────────────
#
#  Docker (managed here):
#    ollama         → local model inference at :11434
#    open-webui     → chat UI at :4000
#
#  Local processes (managed by ./lattice):
#    MCPO           → proxies stdio MCP servers to HTTP/SSE at :8001
#    Lattice Manager → configurator UI at :5000
#
#  First-time setup:
#    docker compose up -d ollama open-webui
#    ./lattice setup
#    ./lattice seed
#    ./lattice web
#
#  Open WebUI MCP registration (one-time, in the admin UI):
#    Settings → Tools → + Add Tool
#    URL: http://host.docker.internal:8001/lims/sse   (type: MCP)
#    URL: http://host.docker.internal:8001/qms/sse    (type: MCP)
#    URL: http://host.docker.internal:8001/rosetta/sse (type: MCP)
